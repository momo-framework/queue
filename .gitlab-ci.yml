stages:
  - verify
  - publish

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure

variables:
  COMPOSER_ALLOW_SUPERUSER: "1"
  COMPOSER_NO_INTERACTION: "1"

.php:
  stage: verify
  image: registry.gitlab.com/anidzen/momo/php:6.2.3-php8.5
  needs: []
  cache:
    key:
      prefix: composer-8.5
      files:
        - composer.json
    paths:
      - vendor
  before_script:
    - apk add --no-cache git > /dev/null
    - export COMPOSER_AUTH="{\"http-basic\":{\"${REGISTRY_URL#https://}\":{\"username\":\"$COMPOSER_USER\",\"password\":\"$COMPOSER_PASSWORD\"}}}"
    - composer update --no-progress --prefer-dist

rector:
  extends: .php
  script:
    - composer rector

lint:
  extends: .php
  script:
    - composer lint:check

analyse:
  extends: .php
  script:
    - composer analyse

test:
  extends: .php
  services:
    - name: rabbitmq:4-alpine
      alias: rabbitmq
  variables:
    AMQP_HOST: "rabbitmq"
  script:
    - timeout 120 sh -c 'until nc -z rabbitmq 5672; do sleep 1; done'
    - composer test

config:
  stage: verify
  image: registry.gitlab.com/anidzen/momo/php:6.2.3-php8.5
  needs: []
  before_script:
    - apk add --no-cache git > /dev/null
    - export COMPOSER_AUTH="{\"http-basic\":{\"${REGISTRY_URL#https://}\":{\"username\":\"$COMPOSER_USER\",\"password\":\"$COMPOSER_PASSWORD\"}}}"
  script:
    - composer global config repositories.anidzen composer "$REGISTRY_URL/repository/composer/"
    - composer global require --no-progress anidzen/momo-config:^0.1.2
    - "$(composer global config bin-dir --absolute 2>/dev/null)/momo-config check"

publish:
  stage: publish
  image: composer:2
  needs:
    - rector
    - lint
    - analyse
    - test
    - config
  rules:
    - if: $CI_COMMIT_TAG
  interruptible: false
  resource_group: composer-publish
  before_script:
    - apk add --no-cache jq
  script:
    - |
      NAME=$(jq -r .name composer.json)
      VERSION=$(jq -r .version composer.json)
      if [ "v$VERSION" != "$CI_COMMIT_TAG" ]; then
        echo "composer.json says $VERSION, tag says $CI_COMMIT_TAG."
        exit 1
      fi
      REPO_URL="$REGISTRY_URL/repository/composer"
      METADATA_URL="$REPO_URL/p2/$NAME.json"
      STATUS=$(curl -s -o /tmp/metadata.json -w '%{http_code}' -u "$COMPOSER_USER:$COMPOSER_PASSWORD" "$METADATA_URL")
      case "$STATUS" in
        200) ;;
        404) jq -n --arg name "$NAME" '{packages: {($name): []}}' > /tmp/metadata.json ;;
        *) echo "GET $METADATA_URL returned $STATUS."; exit 1 ;;
      esac
      if jq -e --arg name "$NAME" --arg version "$VERSION" '.packages[$name] | any(.version == $version)' /tmp/metadata.json > /dev/null; then
        echo "$NAME $VERSION is already published."
        exit 0
      fi
    - composer archive --format=zip --dir=/tmp/dist --file="$CI_COMMIT_TAG"
    - |
      DIST_URL="$REPO_URL/dist/$CI_PROJECT_PATH/$CI_COMMIT_TAG.zip"
      curl -sf -u "$COMPOSER_USER:$COMPOSER_PASSWORD" --upload-file "/tmp/dist/$CI_COMMIT_TAG.zip" "$DIST_URL"
      jq --arg url "$DIST_URL" --arg sha "$(sha1sum "/tmp/dist/$CI_COMMIT_TAG.zip" | cut -d' ' -f1)" \
        '. + {dist: {type: "zip", url: $url, shasum: $sha}}' composer.json > /tmp/entry.json
      jq --arg name "$NAME" --slurpfile entry /tmp/entry.json '.packages[$name] += $entry' /tmp/metadata.json > /tmp/p2.json
      curl -sf -u "$COMPOSER_USER:$COMPOSER_PASSWORD" --upload-file /tmp/p2.json "$METADATA_URL"

release:cut:
  stage: publish
  image: registry.gitlab.com/gitlab-org/cli:v1.123.0
  needs:
    - rector
    - lint
    - analyse
    - test
    - config
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  interruptible: false
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  before_script:
    - apk add --no-cache jq git
  script:
    - |
      VERSION=$(jq -r .version composer.json)
      TAG="v$VERSION"
      if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
        echo "$TAG already exists, nothing to release."
        exit 0
      fi
      awk -v version="$VERSION" '/^## \[/ { found = index($0, "## [" version "]") == 1; next } found' CHANGELOG.md > notes.md
      if ! grep -q '[^[:space:]]' notes.md; then
        echo "CHANGELOG.md has no entry for $VERSION."
        exit 1
      fi
      printf '\n### Install\n\n```bash\ncomposer require %s:^%s\n```\n' "$(jq -r .name composer.json)" "${VERSION%.*}" >> notes.md
      glab release create "$TAG" --ref "$CI_COMMIT_SHA" --name "$TAG" --notes-file notes.md
